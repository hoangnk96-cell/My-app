name: Build Full Time Tracker EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Create full featured code with non-resetting save behavior
      shell: pwsh
      run: |
        $code = @"
        import tkinter as tk
        import customtkinter as ctk
        from datetime import datetime
        import json
        import os
        import math

        ctk.set_appearance_mode("Light")  
        ctk.set_default_color_theme("blue")

        USER_DOCUMENTS_DIR = os.path.join(os.path.expanduser("~"), "Documents")
        DB_FILE = os.path.join(USER_DOCUMENTS_DIR, "time_tracker_secure_db.json")

        class TimeTrackerApp(ctk.CTk):
            def __init__(self):
                super().__init__()
                self.title("Time Tracking")
                self.geometry("1000x630")
                self.configure(fg_color="#f5f5f5")
                
                self.is_running = False  
                self.is_pm = True 
                self.selected_task_id = 1
                self.task_frames = {}
                
                self.load_data_from_db()
                
                self.init_ui()
                if self.tasks:
                    self.load_task_details(self.selected_task_id) 
                self.update_timer_loop()

            def load_data_from_db(self):
                if os.path.exists(DB_FILE):
                    try:
                        with open(DB_FILE, "r", encoding="utf-8") as f:
                            data = json.load(f)
                            self.tasks = data.get("tasks", [])
                            self.selected_task_id = data.get("selected_task_id", 1)
                            if self.tasks:
                                return
                    except Exception:
                        pass
                
                current_date_str = datetime.now().strftime("%a, %d/%m/%Y")
                self.tasks = [
                    {"id": 1, "name": "Without task", "seconds": 2, "desc": "", "details": "", "task_type": "Without task", "start_h": "03", "start_m": "36", "is_pm": True, "selected": True, "date": current_date_str},
                    {"id": 2, "name": "Task 2 • Without task", "seconds": 180, "desc": "srgdfg", "details": "ádfgsfdg", "task_type": "Without task", "start_h": "01", "start_m": "20", "is_pm": True, "selected": False, "date": current_date_str},
                    {"id": 3, "name": "Task 1 • Without task", "seconds": 180, "desc": "", "details": "", "task_type": "Without task", "start_h": "11", "start_m": "05", "is_pm": False, "selected": False, "date": current_date_str},
                ]
                self.selected_task_id = 1
                self.save_data_to_db()

            def save_data_to_db(self):
                try:
                    data = {
                        "selected_task_id": self.selected_task_id,
                        "tasks": self.tasks
                    }
                    with open(DB_FILE, "w", encoding="utf-8") as f:
                        json.dump(data, f, ensure_ascii=False, indent=4)
                except Exception as e:
                    print("Error saving database:", e)

            def init_ui(self):
                # --- TOP BAR ---
                top_frame = ctk.CTkFrame(self, fg_color="transparent")
                top_frame.pack(fill="x", padx=20, pady=10)
                title_lbl = ctk.CTkLabel(top_frame, text="Time tracking", font=("Arial", 24, "bold"), text_color="black")
                title_lbl.pack(side="left")
                
                btn_add = ctk.CTkButton(top_frame, text="+ Add work unit", width=100, fg_color="transparent", text_color="#1e293b", hover_color="#e2e8f0", command=self.add_task)
                btn_add.pack(side="left", padx=20)
                
                # --- ACTION BAR ---
                action_frame = ctk.CTkFrame(self, fg_color="transparent")
                action_frame.pack(fill="x", padx=20, pady=5)
                
                self.btn_toggle_work = ctk.CTkButton(action_frame, text="▶ Start work", width=110, fg_color="#0056b3", text_color="white", font=("Arial", 13, "bold"), command=self.toggle_work_status)
                self.btn_toggle_work.pack(side="left", padx=5)
                
                ctk.CTkButton(action_frame, text="💾 Save", width=70, fg_color="transparent", text_color="black", command=self.save_task_details).pack(side="right", padx=5)
                ctk.CTkButton(action_frame, text="🗑 Delete", width=70, fg_color="transparent", text_color="black", command=self.delete_task).pack(side="right", padx=5)

                # --- MAIN BODY ---
                main_frame = ctk.CTkFrame(self, fg_color="transparent")
                main_frame.pack(fill="both", expand=True, padx=20, pady=10)
                
                self.left_col = ctk.CTkScrollableFrame(main_frame, fg_color="white", corner_radius=8, border_width=1, border_color="#e0e0e0")
                self.left_col.pack(side="left", fill="both", expand=True, padx=(0, 10))
                
                self.date_lbl = ctk.CTkLabel(self.left_col, text="", font=("Arial", 14, "bold"), text_color="black")
                self.date_lbl.pack(anchor="w", padx=10, pady=10)
                
                self.render_tasks()

                # Right Column Form Panel
                right_col = ctk.CTkFrame(main_frame, fg_color="transparent", width=320)
                right_col.pack(side="right", fill="both", padx=(10, 0))
                right_col.pack_propagate(False)
                
                ctk.CTkLabel(right_col, text="Description", text_color="black", font=("Arial", 12)).pack(anchor="w", pady=(5, 2))
                self.entry_desc = ctk.CTkEntry(right_col, fg_color="white", text_color="black", border_color="#cbd5e1", height=35)
                self.entry_desc.pack(fill="x", pady=(0, 10))
                
                ctk.CTkLabel(right_col, text="Details", text_color="black", font=("Arial", 12)).pack(anchor="w", pady=(5, 2))
                self.txt_details = ctk.CTkTextbox(right_col, fg_color="white", text_color="black", border_color="#cbd5e1", height=80, border_width=
